<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League All-Time XI Builder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2rem;
            background: linear-gradient(90deg, #fff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: 0.85rem;
            color: #aaa;
        }

        select, input[type="text"] {
            padding: 10px 15px;
            border: 2px solid #3a3a5c;
            border-radius: 8px;
            background: #2a2a4a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input[type="text"]:focus {
            border-color: #a855f7;
        }

        .pitch-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto 30px;
            aspect-ratio: 3/4;
            background: linear-gradient(to bottom,
                #2d8a3e 0%, #2d8a3e 49.5%,
                #fff 49.5%, #fff 50.5%,
                #2d8a3e 50.5%, #2d8a3e 100%);
            border-radius: 10px;
            border: 4px solid #fff;
            overflow: hidden;
        }

        .pitch-markings {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        /* Center circle */
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border: 3px solid rgba(255,255,255,0.5);
            border-radius: 50%;
        }

        /* Penalty areas */
        .penalty-area {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 18%;
            border: 3px solid rgba(255,255,255,0.5);
        }

        .penalty-area.top {
            top: 0;
            border-top: none;
        }

        .penalty-area.bottom {
            bottom: 0;
            border-bottom: none;
        }

        /* Goal areas */
        .goal-area {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 30%;
            height: 8%;
            border: 3px solid rgba(255,255,255,0.5);
        }

        .goal-area.top {
            top: 0;
            border-top: none;
        }

        .goal-area.bottom {
            bottom: 0;
            border-bottom: none;
        }

        .players-container {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        .row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex: 1;
        }

        .player {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .player:hover {
            transform: scale(1.1);
        }

        .player-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38003c 0%, #00ff85 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.75rem;
            border: 3px solid #fff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .player-name {
            background: rgba(0,0,0,0.7);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            max-width: 80px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-name.empty {
            color: #888;
            font-style: italic;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #2a2a4a;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .modal h3 {
            margin-bottom: 20px;
            color: #a855f7;
        }

        .modal input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn-primary {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: #fff;
        }

        .btn-secondary {
            background: #3a3a5c;
            color: #fff;
        }

        .btn-danger {
            background: #dc2626;
            color: #fff;
        }

        /* Actions */
        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        /* Team name */
        .team-name-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .team-name-input {
            font-size: 1.5rem;
            text-align: center;
            background: transparent;
            border: 2px dashed #3a3a5c;
            padding: 10px 20px;
            width: 100%;
            max-width: 400px;
        }

        .team-name-input:focus {
            border-style: solid;
        }

        /* Roster list */
        .roster {
            background: #2a2a4a;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .roster h3 {
            margin-bottom: 15px;
            color: #a855f7;
        }

        .roster-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .roster-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #3a3a5c;
            border-radius: 6px;
        }

        .roster-position {
            font-size: 0.75rem;
            color: #a855f7;
            min-width: 30px;
        }

        .roster-player {
            flex: 1;
        }

        .roster-player.empty {
            color: #666;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .player-circle {
                width: 40px;
                height: 40px;
                font-size: 0.65rem;
            }

            .player-name {
                font-size: 0.6rem;
                max-width: 60px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Premier League All-Time XI</h1>
        <p class="subtitle">Build your dream team from Premier League history</p>

        <div class="team-name-container">
            <input type="text" class="team-name-input" id="teamName" placeholder="Enter Team Name..." value="My All-Time XI">
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Formation</label>
                <select id="formation">
                    <option value="4-4-2">4-4-2</option>
                    <option value="4-3-3">4-3-3</option>
                    <option value="4-2-3-1">4-2-3-1</option>
                    <option value="3-5-2">3-5-2</option>
                    <option value="3-4-3">3-4-3</option>
                    <option value="5-3-2">5-3-2</option>
                    <option value="5-4-1">5-4-1</option>
                    <option value="4-5-1">4-5-1</option>
                    <option value="4-1-4-1">4-1-4-1</option>
                    <option value="4-3-2-1">4-3-2-1</option>
                </select>
            </div>
        </div>

        <div class="pitch-container">
            <div class="pitch-markings">
                <div class="center-circle"></div>
                <div class="penalty-area top"></div>
                <div class="penalty-area bottom"></div>
                <div class="goal-area top"></div>
                <div class="goal-area bottom"></div>
            </div>
            <div class="players-container" id="playersContainer">
                <!-- Players will be rendered here -->
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="shareTeam()">📋 Copy to Clipboard</button>
            <button class="btn btn-secondary" onclick="randomizeTeam()">🎲 Randomize</button>
            <button class="btn btn-danger" onclick="clearTeam()">🗑️ Clear All</button>
        </div>

        <div class="roster">
            <h3>Squad List</h3>
            <div class="roster-list" id="rosterList">
                <!-- Roster items will be rendered here -->
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h3 id="modalTitle">Edit Player</h3>
            <input type="text" id="playerNameInput" placeholder="Enter player name...">
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="savePlayer()">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Formation definitions: rows from attack (top) to goalkeeper (bottom)
        const formations = {
            '4-4-2': {
                rows: [
                    { positions: ['ST', 'ST'] },
                    { positions: ['LM', 'CM', 'CM', 'RM'] },
                    { positions: ['LB', 'CB', 'CB', 'RB'] },
                    { positions: ['GK'] }
                ]
            },
            '4-3-3': {
                rows: [
                    { positions: ['LW', 'ST', 'RW'] },
                    { positions: ['CM', 'CM', 'CM'] },
                    { positions: ['LB', 'CB', 'CB', 'RB'] },
                    { positions: ['GK'] }
                ]
            },
            '4-2-3-1': {
                rows: [
                    { positions: ['ST'] },
                    { positions: ['LW', 'CAM', 'RW'] },
                    { positions: ['CDM', 'CDM'] },
                    { positions: ['LB', 'CB', 'CB', 'RB'] },
                    { positions: ['GK'] }
                ]
            },
            '3-5-2': {
                rows: [
                    { positions: ['ST', 'ST'] },
                    { positions: ['LM', 'CM', 'CAM', 'CM', 'RM'] },
                    { positions: ['CB', 'CB', 'CB'] },
                    { positions: ['GK'] }
                ]
            },
            '3-4-3': {
                rows: [
                    { positions: ['LW', 'ST', 'RW'] },
                    { positions: ['LM', 'CM', 'CM', 'RM'] },
                    { positions: ['CB', 'CB', 'CB'] },
                    { positions: ['GK'] }
                ]
            },
            '5-3-2': {
                rows: [
                    { positions: ['ST', 'ST'] },
                    { positions: ['CM', 'CM', 'CM'] },
                    { positions: ['LWB', 'CB', 'CB', 'CB', 'RWB'] },
                    { positions: ['GK'] }
                ]
            },
            '5-4-1': {
                rows: [
                    { positions: ['ST'] },
                    { positions: ['LM', 'CM', 'CM', 'RM'] },
                    { positions: ['LWB', 'CB', 'CB', 'CB', 'RWB'] },
                    { positions: ['GK'] }
                ]
            },
            '4-5-1': {
                rows: [
                    { positions: ['ST'] },
                    { positions: ['LM', 'CM', 'CAM', 'CM', 'RM'] },
                    { positions: ['LB', 'CB', 'CB', 'RB'] },
                    { positions: ['GK'] }
                ]
            },
            '4-1-4-1': {
                rows: [
                    { positions: ['ST'] },
                    { positions: ['LM', 'CM', 'CM', 'RM'] },
                    { positions: ['CDM'] },
                    { positions: ['LB', 'CB', 'CB', 'RB'] },
                    { positions: ['GK'] }
                ]
            },
            '4-3-2-1': {
                rows: [
                    { positions: ['ST'] },
                    { positions: ['CF', 'CF'] },
                    { positions: ['CM', 'CM', 'CM'] },
                    { positions: ['LB', 'CB', 'CB', 'RB'] },
                    { positions: ['GK'] }
                ]
            }
        };

        // Sample legendary players for randomization
        const legendaryPlayers = {
            GK: ['Peter Schmeichel', 'David Seaman', 'Edwin van der Sar', 'Petr Cech', 'Alisson'],
            CB: ['Rio Ferdinand', 'John Terry', 'Virgil van Dijk', 'Tony Adams', 'Vincent Kompany', 'Nemanja Vidic'],
            LB: ['Ashley Cole', 'Patrice Evra', 'Andy Robertson', 'Denis Irwin', 'Stuart Pearce'],
            RB: ['Gary Neville', 'Trent Alexander-Arnold', 'Lauren', 'Kyle Walker', 'Branislav Ivanovic'],
            LWB: ['Ashley Cole', 'Andy Robertson', 'Marcos Alonso', 'Patrice Evra'],
            RWB: ['Kyle Walker', 'Trent Alexander-Arnold', 'Reece James', 'César Azpilicueta'],
            CDM: ['Patrick Vieira', 'Roy Keane', 'Claude Makélélé', 'N\'Golo Kanté', 'Fernandinho'],
            CM: ['Steven Gerrard', 'Frank Lampard', 'Paul Scholes', 'Kevin De Bruyne', 'David Silva', 'Yaya Touré'],
            CAM: ['Dennis Bergkamp', 'Kevin De Bruyne', 'David Silva', 'Gianfranco Zola', 'Juan Mata'],
            LM: ['Ryan Giggs', 'Robert Pires', 'Eden Hazard', 'Gareth Bale', 'Sadio Mané'],
            RM: ['David Beckham', 'Cristiano Ronaldo', 'Mohamed Salah', 'Arjen Robben', 'Riyad Mahrez'],
            LW: ['Ryan Giggs', 'Eden Hazard', 'Sadio Mané', 'Robert Pires', 'Son Heung-min'],
            RW: ['Mohamed Salah', 'Cristiano Ronaldo', 'David Beckham', 'Arjen Robben', 'Raheem Sterling'],
            CF: ['Wayne Rooney', 'Eric Cantona', 'Dennis Bergkamp', 'Robin van Persie', 'Teddy Sheringham'],
            ST: ['Thierry Henry', 'Alan Shearer', 'Sergio Agüero', 'Wayne Rooney', 'Didier Drogba', 'Harry Kane', 'Erling Haaland', 'Ruud van Nistelrooy']
        };

        let players = [];
        let currentEditIndex = null;
        let currentFormation = '4-4-2';

        function init() {
            loadFromStorage();
            document.getElementById('formation').value = currentFormation;
            renderPitch();
            renderRoster();

            document.getElementById('formation').addEventListener('change', (e) => {
                currentFormation = e.target.value;
                // Preserve player names when changing formation
                const savedNames = players.map(p => p.name);
                initPlayers();
                // Restore names to matching positions where possible
                players.forEach((player, i) => {
                    if (savedNames[i]) {
                        player.name = savedNames[i];
                    }
                });
                renderPitch();
                renderRoster();
                saveToStorage();
            });

            document.getElementById('teamName').addEventListener('input', saveToStorage);

            document.getElementById('playerNameInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') savePlayer();
            });

            document.getElementById('modalOverlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('modalOverlay')) closeModal();
            });
        }

        function initPlayers() {
            players = [];
            const formation = formations[currentFormation];
            formation.rows.forEach(row => {
                row.positions.forEach(pos => {
                    players.push({ position: pos, name: '' });
                });
            });
        }

        function renderPitch() {
            const container = document.getElementById('playersContainer');
            container.innerHTML = '';

            const formation = formations[currentFormation];
            let playerIndex = 0;

            formation.rows.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'row';

                row.positions.forEach(pos => {
                    const player = players[playerIndex];
                    const playerDiv = document.createElement('div');
                    playerDiv.className = 'player';
                    playerDiv.onclick = () => openModal(playerIndex);

                    playerDiv.innerHTML = `
                        <div class="player-circle">${player.position}</div>
                        <div class="player-name ${player.name ? '' : 'empty'}">${player.name || 'Tap to add'}</div>
                    `;

                    rowDiv.appendChild(playerDiv);
                    playerIndex++;
                });

                container.appendChild(rowDiv);
            });
        }

        function renderRoster() {
            const list = document.getElementById('rosterList');
            list.innerHTML = '';

            players.forEach((player, index) => {
                const item = document.createElement('div');
                item.className = 'roster-item';
                item.onclick = () => openModal(index);
                item.innerHTML = `
                    <span class="roster-position">${player.position}</span>
                    <span class="roster-player ${player.name ? '' : 'empty'}">${player.name || 'Click to add'}</span>
                `;
                list.appendChild(item);
            });
        }

        function openModal(index) {
            currentEditIndex = index;
            const player = players[index];
            document.getElementById('modalTitle').textContent = `Edit ${player.position}`;
            document.getElementById('playerNameInput').value = player.name;
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('playerNameInput').focus();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            currentEditIndex = null;
        }

        function savePlayer() {
            if (currentEditIndex !== null) {
                const name = document.getElementById('playerNameInput').value.trim();
                players[currentEditIndex].name = name;
                renderPitch();
                renderRoster();
                saveToStorage();
            }
            closeModal();
        }

        function clearTeam() {
            if (confirm('Clear all players?')) {
                players.forEach(p => p.name = '');
                renderPitch();
                renderRoster();
                saveToStorage();
            }
        }

        function randomizeTeam() {
            players.forEach(player => {
                const options = legendaryPlayers[player.position] || legendaryPlayers['CM'];
                player.name = options[Math.floor(Math.random() * options.length)];
            });
            renderPitch();
            renderRoster();
            saveToStorage();
        }

        function shareTeam() {
            const teamName = document.getElementById('teamName').value || 'My All-Time XI';
            let text = `⚽ ${teamName}\n`;
            text += `📋 Formation: ${currentFormation}\n\n`;

            const formation = formations[currentFormation];
            let playerIndex = 0;

            formation.rows.forEach(row => {
                const rowPlayers = row.positions.map(pos => {
                    const player = players[playerIndex++];
                    return `${player.position}: ${player.name || '(empty)'}`;
                });
                text += rowPlayers.join(' | ') + '\n';
            });

            navigator.clipboard.writeText(text).then(() => {
                alert('Team copied to clipboard!');
            }).catch(() => {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('Team copied to clipboard!');
            });
        }

        function saveToStorage() {
            const data = {
                formation: currentFormation,
                teamName: document.getElementById('teamName').value,
                players: players
            };
            localStorage.setItem('plXI', JSON.stringify(data));
        }

        function loadFromStorage() {
            const saved = localStorage.getItem('plXI');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    currentFormation = data.formation || '4-4-2';
                    document.getElementById('teamName').value = data.teamName || 'My All-Time XI';
                    players = data.players || [];

                    // Validate players match formation
                    const formation = formations[currentFormation];
                    let expectedCount = 0;
                    formation.rows.forEach(row => expectedCount += row.positions.length);

                    if (players.length !== expectedCount) {
                        initPlayers();
                    }
                } catch (e) {
                    initPlayers();
                }
            } else {
                initPlayers();
            }
        }

        init();
    </script>
</body>
</html>
